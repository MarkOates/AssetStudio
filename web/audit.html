<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Asset Viewer - Audit Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: #252525;
            border: 1px solid #3a3a3a;
            border-radius: 5px;
            padding: 1.5rem;
            text-align: center;
        }
        .stat-card h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1rem;
            color: #999999;
        }
        .stat-card .value {
            font-size: 2rem;
            color: #eeeeee;
        }
        
        .error-group {
            margin-bottom: 2rem;
            background: #252525;
            border: 1px solid #3a3a3a;
            border-radius: 5px;
            overflow: hidden;
        }
        .error-group-header {
            padding: 1rem 1.5rem;
            background: #2d2d2d;
            border-bottom: 1px solid #3a3a3a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .error-group-header h3 {
            margin: 0;
            color: #e74c3c;
            font-size: 1.1rem;
        }
        .error-group-content {
            padding: 1.5rem;
            display: none;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .error-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .error-table th, .error-table td {
            text-align: left;
            padding: 0.5rem;
            border-bottom: 1px solid #3a3a3a;
        }
        .error-table th {
            color: #999999;
        }
        .error-table td {
            color: #cccccc;
        }
    </style>
</head>
<body>
    <header>
        <h1>Asset Viewer</h1>
        <nav>
            <a href="index.html">All Assets</a>
            <a href="vendor.html">Vendors</a>
            <a href="audit.html">Audit Dashboard</a>
            <a href="https://docs.google.com/spreadsheets/d/1qWKh4-TxAhIQEa7LUg-ih9xsCWANSLRtvwzVyYH0HIM" target="_blank">Sheet</a>
            <button onclick="syncData()" id="sync-btn" class="nav-btn"><i class="fa-solid fa-rotate"></i> Refresh</button>
        </nav>
    </header>
    <main>
        <h2 style="margin-bottom: 1.5rem;">Synchronization Audit Dashboard</h2>
        <div id="dashboard-loading" style="color: #999;">Crunching 10,000+ discrepancies...</div>
        <div id="dashboard-content" style="display: none;">
            <div id="dashboard-stats" class="dashboard-stats"></div>
            <h3 style="margin-top: 3rem; margin-bottom: 1rem;">Discrepancy Breakdown</h3>
            <div id="dashboard-errors"></div>
        </div>
    </main>
    <script src="app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadData().then(data => {
                document.getElementById('dashboard-loading').style.display = 'none';
                document.getElementById('dashboard-content').style.display = 'block';
                renderDashboard(data.errors);
            });
        });
    </script>
</body>
</html>
