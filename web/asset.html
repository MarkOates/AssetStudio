<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Asset Details</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <h1>Asset Viewer</h1>
        <nav>
            <a href="index.html">Assets</a>
            <a href="vendor.html">Artists</a>
            <a href="pack.html">Packs</a>
            <a href="audit.html">Audit</a>
            <a href="https://docs.google.com/spreadsheets/d/1qWKh4-TxAhIQEa7LUg-ih9xsCWANSLRtvwzVyYH0HIM" target="_blank">Sheet</a>
            <button onclick="syncData()" id="sync-btn" class="nav-btn"><i class="fa-solid fa-rotate"></i> Refresh</button>
        </nav>
    </header>
    <main>
        <div id="asset-details">Loading...</div>
    </main>
    <script src="app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadData().then(data => {
                const urlParams = new URLSearchParams(window.location.search);
                const assetId = urlParams.get('id');
                const asset = data.assets.find(a => a.identifier === assetId);
                
                if (asset) {
                    const pack = data.asset_packs[asset.asset_pack_identifier] || {};
                    const provider = pack.provider || 'Unknown';
                    const container = document.getElementById('asset-details');
                    
                    const sheetUrl = `https://docs.google.com/spreadsheets/d/1qWKh4-TxAhIQEa7LUg-ih9xsCWANSLRtvwzVyYH0HIM/edit#gid=646986983&range=A${asset.sheet_row_number}`;
                    
                    const currentFlag = GLOBAL_DATA.flags[asset.identifier] || 'none';
                    const isFav = currentFlag === 'favorite';
                    const isErr = currentFlag === 'error';
                    
                    container.innerHTML = `
                        <div class="show-page-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                            <div style="display: flex; gap: 1rem; align-items: center;">
                                <h2 style="margin: 0;">${asset.name}</h2>
                                <div style="display: flex; gap: 0.5rem; font-size: 1.2rem;">
                                    <button class="flag-fav" onclick="setFlag(event, '${asset.identifier.replace(/'/g, "\\'")}', 'favorite')" style="background: none; border: none; cursor: pointer; color: ${isFav ? '#ffca28' : 'rgba(255,255,255,0.3)'}; padding: 0; margin: 0; transition: color 0.2s;" onmouseover="this.style.color='#ffca28'" onmouseout="if(GLOBAL_DATA.flags['${asset.identifier.replace(/'/g, "\\'")}'] !== 'favorite') this.style.color='rgba(255,255,255,0.3)'">
                                        <i class="fa-solid fa-star"></i>
                                    </button>
                                    <button class="flag-err" onclick="setFlag(event, '${asset.identifier.replace(/'/g, "\\'")}', 'error')" style="background: none; border: none; cursor: pointer; color: ${isErr ? '#ef5350' : 'rgba(255,255,255,0.3)'}; padding: 0; margin: 0; transition: color 0.2s;" onmouseover="this.style.color='#ef5350'" onmouseout="if(GLOBAL_DATA.flags['${asset.identifier.replace(/'/g, "\\'")}'] !== 'error') this.style.color='rgba(255,255,255,0.3)'">
                                        <i class="fa-solid fa-triangle-exclamation"></i>
                                    </button>
                                </div>
                            </div>
                            <div style="display: flex; gap: 1rem;">
                                <button onclick="navigator.clipboard.writeText('Hey Antigravity, please create a tween for asset: ' + '${asset.identifier}').then(() => alert('Copied to clipboard! Paste this into the chat to have Antigravity generate the tweens!'));" class="nav-btn" style="cursor: pointer; background: #252525; padding: 6px 12px; border: 1px solid #0a84ff; color: #0a84ff; border-radius: 4px; display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; margin: 0; transition: all 0.2s;" onmouseover="this.style.background='#0a84ff'; this.style.color='#ffffff';" onmouseout="this.style.background='#252525'; this.style.color='#0a84ff';">
                                    <i class="fa-solid fa-wand-magic-sparkles"></i> Create Tween
                                </button>
                                <a href="${sheetUrl}" target="_blank" class="nav-btn" style="text-decoration: none; padding: 6px 12px; border: 1px solid #3a3a3a; border-radius: 4px; display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; margin: 0;"><i class="fa-solid fa-pen-to-square"></i> Edit Row ${asset.sheet_row_number}</a>
                            </div>
                        </div>
                        
                        <div style="display: flex; gap: 2rem; margin-bottom: 2rem; align-items: stretch;">
                            <!-- Left Column: Large Preview -->
                            <div style="flex: 0 0 350px; border-radius: 5px; overflow: hidden; border: 1px solid #3a3a3a; background: #161616; display: flex; align-items: center; justify-content: center; height: 300px;">
                                ${generateAssetPreviewHtml(asset, 300)}
                            </div>
                            
                            <!-- Right Column: Metadata -->
                            <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 0.85rem; font-size: 1.05rem;">
                                <div><strong style="color: #aaaaaa; display: inline-block; width: 120px;">Provider:</strong> <a href="vendor.html?name=${encodeURIComponent(provider)}" style="color: #eeeeee; text-decoration: none;">${provider}</a></div>
                                <div><strong style="color: #aaaaaa; display: inline-block; width: 120px;">Pack:</strong> <span style="color: #eeeeee;">${pack.pack_name || 'Unknown'}</span></div>
                                <div><strong style="color: #aaaaaa; display: inline-block; width: 120px;">Type:</strong> <span style="color: #eeeeee;">${asset.type}</span></div>
                                <div><strong style="color: #aaaaaa; display: inline-block; width: 120px;">Source URL:</strong> <a href="${pack.source_url}" target="_blank" style="color: #3498db; text-decoration: none;">${pack.source_url || 'N/A'}</a></div>
                                <div><strong style="color: #aaaaaa; display: inline-block; width: 120px;">Sync Status:</strong> ${pack.sync_status === 'synced' ? '<span style="color: #2ecc71;">Synced</span>' : `<span style="color: #e74c3c;">${pack.sync_status}</span>`}</div>
                                <div style="display: flex; align-items: flex-start; margin-top: 0.5rem;">
                                    <strong style="color: #aaaaaa; display: inline-block; width: 120px; padding-top: 0.25rem;">User Notes:</strong>
                                    <div style="flex: 1; display: flex; flex-direction: column; gap: 0.5rem;">
                                        <textarea id="user-note-input" style="width: 100%; height: 80px; background: #252525; border: 1px solid #3a3a3a; color: #eeeeee; padding: 0.5rem; border-radius: 4px; resize: vertical; font-family: inherit;">${GLOBAL_DATA.notes ? (GLOBAL_DATA.notes[asset.identifier] || '') : ''}</textarea>
                                        <div style="text-align: right;">
                                            <button id="save-note-btn" onclick="saveNote('${asset.identifier.replace(/'/g, "\\'")}')" class="nav-btn" style="cursor: pointer; background: #252525; padding: 4px 12px; border: 1px solid #3a3a3a; color: #eeeeee; border-radius: 4px; font-size: 0.85rem; transition: background 0.2s;" onmouseover="this.style.background='#333333'" onmouseout="this.style.background='#252525'">Save Note</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <h3 style="margin-top: 2rem;">Source Files:</h3>
                        <div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 3rem;">
                            ${(asset.resource && asset.resource.source_files) ? asset.resource.source_files.map(file => `
                                <div style="border: 1px solid #3a3a3a; background: #161616; padding: 10px; border-radius: 4px; display: flex; flex-direction: column; align-items: center;">
                                    ${file.toLowerCase().endsWith('.wav') || file.toLowerCase().endsWith('.ogg') || file.toLowerCase().endsWith('.mp3') ? 
                                        `<audio controls src="${file}" style="max-width: 200px; margin-bottom: 10px;"></audio>` :
                                        `<img src="${file}" alt="${file.split('/').pop()}" style="max-width: 150px; max-height: 150px; image-rendering: pixelated; object-fit: contain;">`
                                    }
                                    <div style="font-size: 0.8rem; color: #888; margin-top: 5px; word-break: break-all; max-width: 150px; text-align: center;">${file.split('/').pop()}</div>
                                </div>
                            `).join('') : '<div style="color:#888;">No source files found.</div>'}
                        </div>
                        
                        <h3 style="margin-top: 2rem;">Raw Data:</h3>
                        <table class="data-table">
                            <tbody>
                                ${generateTableRows(asset)}
                            </tbody>
                        </table>
                    `;
                    
                    // Spin up the animation loop for this page using the global app.js helper
                    renderAnimations(true);
                } else {
                    document.getElementById('asset-details').textContent = "Asset not found.";
                }
            });
        });
    </script>
</body>
</html>
