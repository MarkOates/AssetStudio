<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Asset Viewer - Vendors</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <h1>Asset Viewer</h1>
        <nav>
            <a href="index.html">All Assets</a>
            <a href="vendor.html">Vendors</a>
            <a href="audit.html">Audit Dashboard</a>
            <a href="https://docs.google.com/spreadsheets/d/1qWKh4-TxAhIQEa7LUg-ih9xsCWANSLRtvwzVyYH0HIM" target="_blank">Sheet</a>
            <button onclick="syncData()" id="sync-btn" class="nav-btn"><i class="fa-solid fa-rotate"></i> Refresh</button>
        </nav>
    </header>
    <main>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2 id="vendor-title" style="margin-bottom: 0;">Vendors</h2>
            <div id="hidden-toggle-container" style="display: none; gap: 1rem;">
                <label class="toggle-btn">
                    <input type="checkbox" id="show-animations-toggle" checked> play animations
                </label>
                <label class="toggle-btn">
                    <input type="checkbox" id="show-hidden-toggle"> show hidden
                </label>
            </div>
        </div>
        <div id="vendor-list"></div>
        <div id="asset-grid" class="grid" style="display: none;"></div>
    </main>
    <script src="app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadData().then(data => {
                const urlParams = new URLSearchParams(window.location.search);
                const vendorName = urlParams.get('name');
                const toggleContainer = document.getElementById('hidden-toggle-container');
                const toggleHidden = document.getElementById('show-hidden-toggle');
                const toggleAnim = document.getElementById('show-animations-toggle');
                
                if (vendorName) {
                    document.getElementById('vendor-title').textContent = `Vendor: ${vendorName}`;
                    document.getElementById('asset-grid').style.display = 'grid';
                    toggleContainer.style.display = 'flex';
                    
                    const vendorAssets = data.assets.filter(a => {
                        const pack = data.asset_packs[a.asset_pack_id];
                        return pack && pack.provider === vendorName;
                    });
                    
                    function updateGrid() {
                        const showHidden = toggleHidden.checked;
                        const showAnim = toggleAnim.checked;
                        const filtered = vendorAssets.filter(a => showHidden || a.visibility !== 'hidden');
                        renderAssetGrid(filtered, document.getElementById('asset-grid'), showAnim);
                    }
                    
                    toggleHidden.addEventListener('change', updateGrid);
                    toggleAnim.addEventListener('change', () => renderAnimations(toggleAnim.checked));
                    updateGrid(); // Initial render
                } else {
                    // Show list of vendors
                    const vendors = Object.keys(data.providers);
                    const list = document.getElementById('vendor-list');
                    vendors.forEach(v => {
                        const link = document.createElement('a');
                        link.href = `vendor.html?name=${encodeURIComponent(v)}`;
                        link.textContent = data.providers[v].name || v;
                        link.style.display = 'block';
                        link.style.marginBottom = '10px';
                        list.appendChild(link);
                    });
                }
            });
        });
    </script>
</body>
</html>
