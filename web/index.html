<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Asset Viewer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
</head>
<body>
    <header>
        <h1>Asset Viewer</h1>
        
        <input type="text" id="search-input" placeholder="Search for assets">
        
        <nav style="display: flex; align-items: center;">
            <a href="index.html">Assets</a>
            <a href="vendor.html">Artists</a>
            <a href="audit.html">Audit</a>
            <a href="https://docs.google.com/spreadsheets/d/1qWKh4-TxAhIQEa7LUg-ih9xsCWANSLRtvwzVyYH0HIM" target="_blank">Sheet</a>
            <button onclick="syncData()" id="sync-btn" class="nav-btn"><i class="fa-solid fa-rotate"></i> Refresh</button>
        </nav>
    </header>
    <main class="full-width">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2 style="margin-bottom: 0;">Assets</h2>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: flex-end;">
                <label class="icon-toggle-btn" title="fill window">
                    <input type="checkbox" id="fill-window-toggle" checked>
                    <span class="material-symbols-outlined">fullscreen</span>
                </label>
                <label class="icon-toggle-btn" title="flush images">
                    <input type="checkbox" id="flush-images-toggle" checked>
                    <span class="material-symbols-outlined">grid_view</span>
                </label>
                <label class="icon-toggle-btn" title="show previews">
                    <input type="checkbox" id="show-previews-toggle">
                    <span class="material-symbols-outlined">image</span>
                </label>
                <label class="icon-toggle-btn" title="play animations">
                    <input type="checkbox" id="show-animations-toggle" checked>
                    <span class="material-symbols-outlined">play_circle</span>
                </label>
                <label class="icon-toggle-btn" title="show icons">
                    <input type="checkbox" id="show-icons-toggle">
                    <span class="material-symbols-outlined">category</span>
                </label>
                <label class="icon-toggle-btn" title="show subframes">
                    <input type="checkbox" id="show-subframes-toggle">
                    <span class="material-symbols-outlined">burst_mode</span>
                </label>
                <label class="icon-toggle-btn" title="show hidden">
                    <input type="checkbox" id="show-hidden-toggle">
                    <span class="material-symbols-outlined">visibility_off</span>
                </label>
            </div>
        </div>
        <div id="asset-grid" class="grid flush-grid"></div>
    </main>
    <script src="app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Synchronize UI layout state with checkboxes (handles browser back/forward form restoration)
            const mainEl = document.querySelector('main');
            const gridEl = document.getElementById('asset-grid');
            if (document.getElementById('fill-window-toggle').checked) { mainEl.classList.add('full-width'); } else { mainEl.classList.remove('full-width'); }
            if (document.getElementById('flush-images-toggle').checked) { gridEl.classList.add('flush-grid'); } else { gridEl.classList.remove('flush-grid'); }

            let showAnimations = document.getElementById('show-animations-toggle').checked;
            let currentSearchQuery = '';
            
            // Global keyboard listener for '/'
            document.addEventListener('keydown', (e) => {
                if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
                    e.preventDefault();
                    document.getElementById('search-input').focus();
                }
            });
            
            loadData().then(data => {
                const grid = document.getElementById('asset-grid');
                
                function updateGrid() {
                    let filtered = document.getElementById('show-hidden-toggle').checked ? data.assets : data.assets.filter(a => a.visibility !== 'hidden');
                    if (!document.getElementById('show-subframes-toggle').checked) {
                        filtered = filtered.filter(a => !a.is_subframe);
                    }
                    if (!document.getElementById('show-previews-toggle').checked) {
                        filtered = filtered.filter(a => a.type !== 'preview');
                    }
                    if (!document.getElementById('show-icons-toggle').checked) {
                        filtered = filtered.filter(a => !a.is_icon);
                    }
                    if (currentSearchQuery) {
                        filtered = filtered.filter(a => {
                            const pack = data.asset_packs[a.asset_pack_identifier] || {};
                            const provider = (pack.provider || '').toLowerCase();
                            const packName = (pack.pack_name || '').toLowerCase();
                            
                            return a.name.toLowerCase().includes(currentSearchQuery) || 
                                   (a.theme_profile && a.theme_profile.tags.some(t => t.toLowerCase().includes(currentSearchQuery))) ||
                                   provider.includes(currentSearchQuery) ||
                                   packName.includes(currentSearchQuery) ||
                                   (a.resource && a.resource.source_files && a.resource.source_files.some(f => f.toLowerCase().includes(currentSearchQuery)));
                        });
                    }
                    renderAssetGrid(filtered, grid, showAnimations);
                }

                updateGrid();
                
                document.getElementById('search-input').addEventListener('input', (e) => {
                    currentSearchQuery = e.target.value.toLowerCase();
                    updateGrid();
                });
                
                document.getElementById('show-hidden-toggle').addEventListener('change', updateGrid);
                document.getElementById('show-subframes-toggle').addEventListener('change', updateGrid);
                document.getElementById('show-previews-toggle').addEventListener('change', updateGrid);
                document.getElementById('show-icons-toggle').addEventListener('change', updateGrid);
                
                document.getElementById('show-animations-toggle').addEventListener('change', (e) => {
                    showAnimations = e.target.checked;
                    updateGrid();
                });
                
                document.getElementById('fill-window-toggle').addEventListener('change', (e) => {
                    if (e.target.checked) {
                        document.querySelector('main').classList.add('full-width');
                    } else {
                        document.querySelector('main').classList.remove('full-width');
                    }
                });
                
                document.getElementById('flush-images-toggle').addEventListener('change', (e) => {
                    if (e.target.checked) {
                        document.getElementById('asset-grid').classList.add('flush-grid');
                    } else {
                        document.getElementById('asset-grid').classList.remove('flush-grid');
                    }
                });
            });
        });
    </script>
</body>
</html>
