<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Asset Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Asset Viewer</h1>
        <nav>
            <a href="index.html">All Assets</a>
            <a href="vendor.html">Vendors</a>
        </nav>
    </header>
    <main>
        <h2>All Assets</h2>
        <div id="asset-grid" class="grid"></div>
    </main>
    <script src="app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadData().then(data => renderAssetGrid(data.assets, document.getElementById('asset-grid')));
        });
    </script>
</body>
</html>
